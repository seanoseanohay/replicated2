nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  proxyRegistry: images.bundlyzer.com/proxy/bundle-analyzer
  imageRegistry: ""
  # Override this at deploy time to pin all component images to a specific tag
  # (e.g. git SHA). Leave empty to use per-component tags below.
  image:
    tag: ""
  imagePullSecrets:
    - name: enterprise-pull-secret
  appEnv: development
  corsAllowedOrigins: "*"
  secretKey: dev-secret-key-change-in-prod
  jwtSecretKey: dev-jwt-secret-change-in-prod
  allowRegistration: true
  appBaseUrl: http://localhost:3001

initContainers:
  image:
    repository: index.docker.io/library/alpine
    tag: "3.20"
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-backend
    tag: 0.1.9
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrapAdmin:
    email: ""
    password: ""
  aiEnabled: "false"
  aiModel: claude-haiku-4-5-20251001
  defaultEmailNotificationsEnabled: false
  defaultEmailRecipients: ""
  defaultSlackNotificationsEnabled: false
  defaultSlackWebhookUrl: ""
  defaultNotifyOnSeverities: critical,high
  maxBundleSizeMb: 500
  dbPoolSize: 5
  dbPoolOverflow: 10
  rateLimitUpload: 10/minute
  rateLimitAi: 20/minute
  metricsEnabled: true

worker:
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-worker
    tag: 0.1.9
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

beat:
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-beat
    tag: 0.1.9
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-frontend
    tag: 0.2.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  backendUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgresql:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: bundleanalyzer
    password: bundleanalyzer
    database: bundleanalyzer
    postgresPassword: postgres
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalPostgresql:
  host: ""
  port: 5432
  username: ""
  password: ""
  database: ""

redis:
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  master:
    persistence:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

minio:
  image:
    repository: index.docker.io/minio/minio
    tag: latest
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: bundles
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  certManager:
    enabled: false
    clusterIssuer: ""
  # CAUTION: Self-signed cert generation is a ONE-TIME operation.
  # Once the TLS secret exists in the cluster, Helm will NEVER overwrite it
  # (see tls-secret.yaml: only generates if secret does not exist).
  # If you need to replace the cert, manually delete the secret first:
  #   kubectl delete secret <release-name>-tls -n <namespace>
  # Then reinstall. For local dev with a custom domain, use mkcert
  # instead of self-signed to avoid browser trust issues.
  generateSelfSignedCert: false
  # DEPRECATED: regenerateSelfSignedCert is permanently ignored.
  # The chart will never regenerate an existing TLS secret.
  regenerateSelfSignedCert: false
  hosts:
    - host: bundle-analyzer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

replicatedLicenseFields:
  aiChatEnabled: "false"

replicated:
  nameOverride: bundle-analyzer-sdk
  image:
    registry: proxy.replicated.com
    repository: library/replicated-sdk-image
    tag: "1.19.3"
  integration:
    enabled: false
    licenseID: ""
