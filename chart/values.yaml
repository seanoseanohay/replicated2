# values.yaml for the Bundle Analyzer Helm chart.
#
# Inline comments above each value become the human-readable description in
# the Replicated Enterprise Portal's Helm Chart Reference. JSON Schema
# descriptions in values.schema.json are kept in sync for IDE tooling and
# validators, but the EP page reads from this file.
#
# Fields tagged `# @docs:skip` are hidden from the customer-facing reference
# page — they're platform-internal (injected by the SDK / Replicated install
# flow, not customer-tunable).

# Override the chart name. Used as the prefix for all rendered resource
# names. Defaults to the chart name `bundle-analyzer`.
nameOverride: ""

# Fully override the rendered resource-name prefix, bypassing the chart-name
# + release-name composition. Use when you need exact control over generated
# names (rarely needed).
fullnameOverride: ""

# Image pull secrets attached to every pod in the chart. Bundle Analyzer's
# default `enterprise-pull-secret` is added automatically when running
# through the Replicated platform; this list is for additional secrets only.
imagePullSecrets: []

global:
  # Default registry path for app images when a per-image `registry` isn't
  # set. Typically points at the Replicated proxy domain
  # (`proxy.replicated.com` for stock installs, a custom domain like
  # `images.bundlyzer.com` for custom-proxy deployments).
  proxyRegistry: images.bundlyzer.com/proxy/bundle-analyzer

  # Optional global registry override for all images. Do NOT set this if any
  # Bitnami subchart is enabled — Bitnami uses `global.imageRegistry`
  # differently and will clobber your subchart image registries. Prefer
  # `global.proxyRegistry` for our app images instead.
  imageRegistry: ""

  image:
    # Optional override that forces a specific tag on every app image
    # (backend, worker, beat, frontend). Leave empty to let each component's
    # `image.tag` fall back to `.Chart.AppVersion`, which is the recommended
    # pattern (release version == image tag).
    tag: ""

  # Image pull secrets propagated to every pod in the chart, including
  # subchart pods (Bitnami honors this via `global.imagePullSecrets`).
  imagePullSecrets:
    - name: enterprise-pull-secret

  # Application environment string passed to the backend pod as `APP_ENV`.
  # Common values: `development`, `production`. Affects logging verbosity
  # and a few feature defaults.
  appEnv: development

  # Comma-separated list of origins permitted by the backend's CORS
  # middleware. Use `*` for any origin (dev only). Set to your customer-
  # facing domain in production, e.g. `https://bundle-analyzer.example.com`.
  corsAllowedOrigins: "*"

  # Application session/CSRF signing secret. Auto-generated on first install
  # by the chart's `app-secrets.yaml` template and preserved across upgrades
  # via the lookup-based secret contract; only override for tests or local
  # dev where you need a known value.
  secretKey: ""

  # JWT signing key used by the backend for issuing access/refresh tokens.
  # Auto-generated on first install and preserved across upgrades —
  # overriding this on a running install will invalidate every customer's
  # active session.
  jwtSecretKey: ""

  # When `true`, the login page exposes the Create Account flow and
  # `POST /api/v1/auth/register` accepts new users. When `false`, the
  # Create Account tab is hidden and the endpoint returns 403. Controlled
  # at install time via the EC config screen `Allow User Registration`
  # field.
  allowRegistration: true

  # Canonical URL used by the backend when constructing absolute links in
  # outbound emails (invitations, notifications). Should match how
  # customers reach the frontend, e.g.
  # `https://bundle-analyzer.example.com`.
  appBaseUrl: http://localhost:3001

initContainers:
  # Image used by the `wait-for-deps` init container in backend/worker/beat
  # pods. Defaults to a small Alpine image with `nc` for TCP readiness
  # probing of Postgres, Redis, and MinIO before the app container starts.
  image:
    repository: index.docker.io/library/alpine
    tag: "3.20"
    pullPolicy: IfNotPresent

backend:
  # Number of backend FastAPI pods. Defaults to 1. Scale up if you have
  # high concurrent API load; backend is stateless so scaling is safe.
  replicaCount: 1

  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-backend
    # Empty tag falls back to .Chart.AppVersion (see _helpers.tpl).
    # Keep this empty so a single Chart.yaml version bump moves every app
    # image. Never pin to `latest` in production — the chart's release
    # version becomes meaningless if the image tag floats.
    tag: ""
    pullPolicy: IfNotPresent

  # Kubernetes Service for the backend. Default `ClusterIP` on port 8000;
  # only change if you need direct external exposure (rare — the frontend
  # usually fronts the backend).
  service:
    type: ClusterIP
    port: 8000

  # Resource requests/limits for the backend pod. Defaults are sized for
  # ~10 concurrent bundle analyses; increase `limits.memory` if processing
  # very large bundles (>200 MB).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrapAdmin:
    # Email address for the bootstrap admin account created at install
    # time. The chart fails to produce a usable install if this AND
    # `global.allowRegistration` are both empty/false.
    email: ""
    # Initial password for the bootstrap admin account. Operators should
    # change this through the in-app account settings after first login.
    password: ""

  # License-gated string-valued flag (`'true'` or `'false'`) injected from
  # the customer license's `ai_chat_enabled` field via `helmchart.yaml`.
  # The backend reads this to enable/disable the
  # `/api/v1/findings/explain` endpoint.
  aiEnabled: "false"

  # Anthropic model ID used by the backend's AI explanation feature.
  # Defaults to `claude-haiku-4-5-20251001`. Customers can rotate the
  # model without redeploying via
  # `kubectl set env deploy/bundle-analyzer-backend BACKEND_AI_MODEL=...`.
  aiModel: claude-haiku-4-5-20251001

  # Install-time default for whether email notifications are enabled in
  # the in-app Notification Settings page on first install. Admins can
  # override later via the UI; the chart value is seed-only.
  defaultEmailNotificationsEnabled: false

  # Comma-separated list of email addresses pre-filled in the in-app
  # Notification Settings on first install. Empty by default. Seed-only
  # — does not override user edits.
  defaultEmailRecipients: ""

  # Install-time default for whether Slack notifications are enabled in
  # the in-app Notification Settings page on first install.
  defaultSlackNotificationsEnabled: false

  # Incoming-webhook URL pre-filled in the in-app Notification Settings on
  # first install. Should be a `https://hooks.slack.com/services/...` URL
  # generated by adding an Incoming Webhooks integration to a Slack
  # channel.
  defaultSlackWebhookUrl: ""

  # Comma-separated finding severities that trigger notifications on
  # first install. Valid values: `critical`, `high`, `medium`, `low`,
  # `info`. Default: `critical,high`.
  defaultNotifyOnSeverities: critical,high

  # Maximum support-bundle upload size in megabytes. The backend rejects
  # uploads larger than this with HTTP 413. Default is 500 MB. Bundle
  # Analyzer is bottlenecked by this on memory-constrained installs —
  # set it lower (e.g., 100) if you're running on a 2-CPU, 4-GB VM and
  # seeing the worker OOMKill while processing large bundles.
  maxBundleSizeMb: 500

  # SQLAlchemy connection pool size (steady-state). Default 5. Match to
  # your Postgres `max_connections` divided by the number of backend +
  # worker replicas; the default fits a single backend pod against the
  # embedded Bitnami Postgres.
  dbPoolSize: 5

  # SQLAlchemy connection pool overflow (temporary burst above
  # `dbPoolSize`). Default 10. Combined with `dbPoolSize: 5` yields 15
  # max concurrent connections per backend pod.
  dbPoolOverflow: 10

  # SlowAPI rate-limit string for the bundle-upload endpoint, applied per
  # source IP. Default `10/minute`. Tighten for multi-tenant deployments;
  # loosen for trusted internal networks.
  rateLimitUpload: 10/minute

  # SlowAPI rate-limit string for the AI-explain endpoint, applied per
  # source IP. Default `20/minute`. AI calls cost real money — keep this
  # conservative.
  rateLimitAi: 20/minute

  # When `true`, the backend reports custom metrics (bundles uploaded,
  # findings count, etc.) to the Replicated SDK sidecar. Default `true`;
  # disable only for true offline air-gap installs that want zero
  # outbound telemetry.
  metricsEnabled: true

worker:
  # Number of Celery worker pods. Scale up when bundle-processing backlog
  # grows. Workers are stateless so scaling is safe. Don't scale `beat`
  # past 1 (see `beat.replicaCount`).
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-worker
    tag: ""
    pullPolicy: IfNotPresent
  # Resource requests/limits for the Celery worker. Default 1 vCPU /
  # 1 GiB; increase memory if processing very large bundles.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

beat:
  # Number of Celery beat scheduler pods. MUST remain at 1. Multiple
  # beats produce duplicated periodic-task firings (rate limit checks,
  # retention purges, license re-validation).
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-beat
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  # Number of frontend nginx pods serving the React SPA. Default 1; scale
  # up only if you have very high concurrent web traffic — the frontend
  # is just serving static assets, not doing computation.
  replicaCount: 1
  image:
    registry: proxy.replicated.com/proxy/bundle-analyzer/ghcr.io
    repository: seanoseanohay/replicated2-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  # URL the frontend uses to reach the backend API. Leave empty to use
  # the in-cluster Service DNS name (`http://bundle-analyzer-backend:8000`).
  # Override only if the frontend runs outside the cluster (e.g. served
  # from a CDN), in which case point at the public backend URL.
  backendUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Bitnami PostgreSQL subchart configuration. When `postgresql.enabled` is
# `true`, the chart deploys an embedded Postgres for application data.
# The application user password is auto-generated by the chart's
# helmchart.yaml wiring (Phase 5.2 contract) and preserved across
# upgrades. See Bitnami's chart docs for the full set of subchart values
# not documented here.
postgresql:
  # Toggle for embedded Postgres. Set to `false` and fill in
  # `externalPostgresql.*` to point at your own database.
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: bundleanalyzer
    password: bundleanalyzer
    database: bundleanalyzer
    postgresPassword: postgres
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalPostgresql:
  # DNS hostname or IP of an external PostgreSQL server, used when
  # `postgresql.enabled` is `false`. Must be reachable from inside the
  # Kubernetes cluster.
  host: ""
  # TCP port of the external PostgreSQL server. Default 5432.
  port: 5432
  # PostgreSQL role Bundle Analyzer will connect as. Must already exist
  # with full privileges on the `database` named below.
  username: ""
  # Password for the external PostgreSQL role. Stored as a Kubernetes
  # Secret in the bundle-analyzer namespace.
  password: ""
  # Name of the existing PostgreSQL database Bundle Analyzer will connect
  # to. The chart does NOT create the database — it must exist before
  # install.
  database: ""

# Bitnami Redis subchart configuration. Redis is the Celery broker +
# result backend; required for worker/beat to function. The chart does
# not currently support pointing at an external Redis.
redis:
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  master:
    persistence:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

minio:
  image:
    repository: index.docker.io/minio/minio
    tag: latest
  # MinIO root access key. Auto-generated to a random value on first
  # install via the chart's secret contract and preserved across
  # upgrades; only override for local dev where you need a known value.
  accessKey: minioadmin
  # MinIO root secret key. Auto-generated on first install and preserved
  # across upgrades — overriding on a running install will rotate the
  # credential and break the backend's connection until pods restart
  # with the new value.
  secretKey: minioadmin
  # MinIO bucket name where bundle tarballs are stored. Default
  # `bundles`. Created automatically on first install.
  bucket: bundles
  persistence:
    # When `true`, MinIO data lives on a PersistentVolumeClaim. Default
    # `true`. Disabling makes the install non-persistent — bundle
    # tarballs are lost on pod restart.
    enabled: true
    # Requested PVC size for MinIO bundle storage. Default 8Gi. Each
    # support bundle is typically 5-50 MB, so 8Gi holds ~200-500
    # bundles. Increase based on retention policy.
    size: 8Gi
    # Explicit StorageClass name for the MinIO PVC. Leave empty to use
    # the cluster's default StorageClass.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  # When `true`, the chart creates a Kubernetes Ingress for the frontend.
  # Default `false` — most installs use NodePort or port-forward access
  # during early evaluation.
  enabled: false
  # Ingress class name (e.g. `nginx`, `traefik`). Required when
  # `enabled: true`; without it, no Ingress controller will claim the
  # resource.
  className: "nginx"
  # Free-form Ingress annotations. Use for cert-manager hints, SSL
  # redirects, body size limits, etc.
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  certManager:
    # When `true`, the chart adds the `cert-manager.io/cluster-issuer`
    # annotation to the Ingress so cert-manager auto-issues a real TLS
    # cert. Mutually exclusive with `generateSelfSignedCert: true`.
    enabled: false
    # Name of the cert-manager ClusterIssuer to use (e.g.
    # `letsencrypt-prod`). Required when `certManager.enabled: true`.
    clusterIssuer: ""
  # CAUTION: Self-signed cert generation is a ONE-TIME operation.
  # Once the TLS secret exists in the cluster, Helm will NEVER overwrite
  # it (see tls-secret.yaml: only generates if secret does not exist).
  # If you need to replace the cert, manually delete the secret first:
  #   kubectl delete secret <release-name>-tls -n <namespace>
  # Then reinstall. For local dev with a custom domain, use mkcert
  # instead of self-signed to avoid browser trust issues.
  generateSelfSignedCert: false
  # DEPRECATED: regenerateSelfSignedCert is permanently ignored.
  # The chart will never regenerate an existing TLS secret.
  # @docs:internal
  regenerateSelfSignedCert: false
  hosts:
    - host: bundle-analyzer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Platform-injected license fields. Replicated populates this at install
# time based on the customer's Vendor Portal license — not customer-set
# and not surfaced in the customer reference page.
# @docs:skip
replicatedLicenseFields:
  # @docs:skip
  aiChatEnabled: "false"

# Replicated SDK subchart. The SDK runs as a sidecar to the backend and
# handles license validation, custom metrics reporting, update
# notifications, and license-gated entitlement checks.
replicated:
  # Service name override so in-cluster DNS resolves to a stable name
  # (`bundle-analyzer-sdk`) regardless of release name. Used by the
  # backend's `REPLICATED_SDK_HOST` env var.
  nameOverride: bundle-analyzer-sdk
  image:
    registry: proxy.replicated.com
    repository: library/replicated-sdk-image
    tag: "1.19.3"
  integration:
    # SDK integration mode. Keep `false` for production EC v3 and Helm
    # installs (the standard delivery path). Only enable for local dev
    # where you're running the SDK against a development license.
    enabled: false
    licenseID: ""
