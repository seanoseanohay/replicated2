apiVersion: v2
name: bundle-analyzer
description: Helm chart for the Bundle Analyzer application
type: application
version: 0.1.1
appVersion: "0.1.1"
dependencies:
  - name: postgresql
    version: ">=16.0.0 <17.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: ">=20.0.0 <21.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: replicated
    alias: bundle-analyzer-sdk
    version: ">=1.19.0"
    repository: oci://registry.replicated.com/library
