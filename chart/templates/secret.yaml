{{- /*
This Secret holds values that are TEMPLATED FROM CHART VALUES and updated on
every upgrade — DB connection URL, Redis URL, MinIO credentials, bootstrap
admin email/password. These are *not* install-time-stable; if values.yaml or
EC config changes, they should change.

For install-time-stable secrets (JWT_SECRET_KEY, SECRET_KEY) see
templates/app-secrets.yaml. Splitting them keeps the contract per-file
obvious: this file rotates, that file does not.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-secret
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "bundle-analyzer.databaseUrl" . | quote }}
  REDIS_URL: {{ include "bundle-analyzer.redisUrl" . | quote }}
  S3_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.backend.bootstrapAdmin.email | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.backend.bootstrapAdmin.password | quote }}
