apiVersion: v1
kind: Service
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-backend
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/component: backend
    {{- include "bundle-analyzer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8000
