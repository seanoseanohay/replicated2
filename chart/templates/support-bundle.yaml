# NOTE: Why a Secret instead of a raw troubleshoot.sh/v1beta2 CRD?
#
# The open-source troubleshoot examples (replicatedhq/troubleshoot) use raw CRDs.
# HOWEVER, those examples are for:
#   1. File-mode CLI usage: kubectl support-bundle ./file.yaml (reads file directly)
#   2. KOTS environments: KOTS pre-installs the troubleshoot.sh CRDs
#
# For Replicated Helm charts, the official docs REQUIRE a Secret wrapper:
#   https://docs.replicated.com/vendor/preflight-defining
#   https://docs.replicated.com/vendor/support-bundle-customizing
#
# Why the Secret is necessary:
#   - Standard Kubernetes clusters do NOT have troubleshoot.sh/v1beta2 CRDs installed.
#     kubectl apply of a raw Preflight/SupportBundle CRD fails with:
#     "no matches for kind 'SupportBundle' in version 'troubleshoot.sh/v1beta2'"
#   - A v1/Secret applies in ANY cluster with zero prerequisites.
#   - The 'troubleshoot.sh/kind' label enables CLI plugin discovery.
#   - Preflight specs live under stringData.preflight.yaml (key name matters).
#   - Support-bundle specs live under stringData.support-bundle-spec (key name matters).
#
# See docs/decision-troubleshoot-secret-vs-crd.md for full analysis, test outputs,
# plugin behavior matrices, and references.
apiVersion: v1
kind: Secret
metadata:
  labels:
    troubleshoot.sh/kind: support-bundle
  name: "{{ .Release.Name }}-support-bundle-config"
stringData:
  support-bundle-spec: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: SupportBundle
    metadata:
      name: bundle-analyzer-support-bundle
    spec:
      collectors:
        - clusterInfo: {}
        - clusterResources:
            namespaces:
              - "{{ .Release.Namespace }}"
        - http:
            collectorName: backend-health
            get:
              url: "http://{{ include "bundle-analyzer.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:8000/health/ready"
              timeout: 10s
        - logs:
            collectorName: backend-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=backend
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: worker-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=worker
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: beat-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=beat
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: frontend-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=frontend
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: sdk-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/name=bundle-analyzer-sdk
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: minio-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=minio
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: postgresql-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=primary
              - app.kubernetes.io/name=postgresql
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
        - logs:
            collectorName: redis-logs
            namespace: "{{ .Release.Namespace }}"
            selector:
              - app.kubernetes.io/component=master
              - app.kubernetes.io/name=redis
              - app.kubernetes.io/instance={{ .Release.Name }}
            limits:
              maxLines: 10000
              maxAge: 720h
              maxBytes: 5000000
      analyzers:
        - clusterVersion:
            checkName: Kubernetes version
            outcomes:
              - fail:
                  when: "< 1.25.0"
                  message: "Bundle Analyzer requires Kubernetes 1.25.0 or later. Your cluster is running {{ .K8sVersion }}. Please upgrade your cluster."
                  uri: https://kubernetes.io
              - pass:
                  message: "Kubernetes version meets requirements (1.25.0 or later)"
        - nodeResources:
            checkName: Cluster has sufficient resources
            outcomes:
              - fail:
                  when: "sum(memoryAllocatable) < 4Gi"
                  message: "Cluster has less than 4GB allocatable memory total. Bundle Analyzer requires at least 4GB across all nodes. Please add nodes or reduce existing workload."
              - fail:
                  when: "sum(cpuCapacity) < 2"
                  message: "Cluster has less than 2 CPU cores total. Bundle Analyzer requires at least 2 cores. Please add nodes or reduce existing workload."
              - pass:
                  message: "Cluster has sufficient CPU and memory resources"
        {{- if .Values.postgresql.primary.persistence.storageClass }}
        - storageClass:
            checkName: Required StorageClass available
            storageClassName: "{{ .Values.postgresql.primary.persistence.storageClass }}"
            outcomes:
              - fail:
                  message: "Required StorageClass '{{ .Values.postgresql.primary.persistence.storageClass }}' not found. Bundle Analyzer requires this StorageClass for PostgreSQL, Redis, and MinIO persistent volumes."
              - pass:
                  message: "Required StorageClass '{{ .Values.postgresql.primary.persistence.storageClass }}' is present."
        {{- end }}
        - deploymentStatus:
            checkName: Backend deployment ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-backend"
            outcomes:
              - fail:
                  when: absent
                  message: "Backend deployment not found. The application API is completely unavailable — users cannot upload bundles, view findings, log in, or access any functionality."
              - fail:
                  when: "< 1"
                  message: "Backend deployment has no ready replicas. The application API is unavailable — users cannot upload bundles, view findings, or interact with the system. Check pod events and logs for crash loops or readiness probe failures."
              - pass:
                  when: ">= 1"
                  message: "Backend deployment has ready replicas."
        - deploymentStatus:
            checkName: Worker deployment ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-worker"
            outcomes:
              - fail:
                  when: absent
                  message: "Worker deployment not found. Bundle processing pipeline is completely stopped — new uploads will queue indefinitely and never be parsed or analyzed."
              - fail:
                  when: "< 1"
                  message: "Worker deployment has no ready replicas. Bundle processing is stopped — new uploads will queue indefinitely. Check pod events and Celery broker connection."
              - pass:
                  when: ">= 1"
                  message: "Worker deployment has ready replicas."
        - deploymentStatus:
            checkName: Frontend deployment ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-frontend"
            outcomes:
              - fail:
                  when: absent
                  message: "Frontend deployment not found. The web UI is completely unavailable — users see a blank page or connection error."
              - fail:
                  when: "< 1"
                  message: "Frontend deployment has no ready replicas. The web UI is unavailable. Check pod events and the backend service connectivity."
              - pass:
                  when: ">= 1"
                  message: "Frontend deployment has ready replicas."
        - deploymentStatus:
            checkName: Beat deployment ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-beat"
            outcomes:
              - fail:
                  when: absent
                  message: "Beat deployment not found. Background tasks are completely stopped — no scheduled cleanup, no stuck-bundle recovery, and custom metrics will not report to the Vendor Portal."
              - fail:
                  when: "< 1"
                  message: "Beat deployment has no ready replicas. Background tasks are stopped — scheduled cleanup and metrics reporting will not run. Check pod events."
              - pass:
                  when: ">= 1"
                  message: "Beat deployment has ready replicas."
        - statefulsetStatus:
            checkName: PostgreSQL StatefulSet ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-postgresql"
            outcomes:
              - fail:
                  when: absent
                  message: "PostgreSQL StatefulSet not found. All persistent data (bundles, findings, users, audit events) is inaccessible. The application cannot start or serve requests."
              - fail:
                  when: "< 1"
                  message: "PostgreSQL StatefulSet has insufficient ready replicas. Database is unavailable — the application cannot read or write any data. Check pod events, PVC status, and storage class provisioning."
              - pass:
                  when: ">= 1"
                  message: "PostgreSQL StatefulSet has ready replicas."
        - statefulsetStatus:
            checkName: Redis StatefulSet ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-redis-master"
            outcomes:
              - fail:
                  when: absent
                  message: "Redis StatefulSet not found. Celery task queue, caching, and session storage are completely unavailable. Background processing and real-time features will not work."
              - fail:
                  when: "< 1"
                  message: "Redis StatefulSet has insufficient ready replicas. Task queue and cache are unavailable — background jobs will not process and API response caching is disabled. Check pod events and PVC status."
              - pass:
                  when: ">= 1"
                  message: "Redis StatefulSet has ready replicas."
        - statefulsetStatus:
            checkName: MinIO StatefulSet ready
            namespace: "{{ .Release.Namespace }}"
            name: "{{ include "bundle-analyzer.fullname" . }}-minio"
            outcomes:
              - fail:
                  when: absent
                  message: "MinIO StatefulSet not found. Object storage is completely unavailable — bundle uploads will fail and existing bundle data is inaccessible."
              - fail:
                  when: "< 1"
                  message: "MinIO StatefulSet has insufficient ready replicas. Object storage is unavailable — bundle uploads will fail. Check pod events, PVC status, and storage class provisioning."
              - pass:
                  when: ">= 1"
                  message: "MinIO StatefulSet has ready replicas."
        - http:
            checkName: Backend health endpoint reachable and serving
            collectorName: backend-health
            outcomes:
              - fail:
                  when: "error"
                  message: "Cannot reach backend health endpoint. Check if the backend pod is running and the service is accessible."
              - fail:
                  when: "statusCode != 200"
                  message: "Backend health endpoint returned a non-200 status. The backend may be running but unable to reach PostgreSQL, Redis, or S3. Check the health endpoint response for details."
              - pass:
                  when: "statusCode == 200"
                  message: "Backend health endpoint is reachable and reporting ready (PostgreSQL, Redis, and S3 all accessible)."
        - textAnalyze:
            checkName: Backend health endpoint reports ready status
            fileName: "backend-health.json"
            regex: '"status"\s*:\s*"ready"'
            outcomes:
              - fail:
                  when: "false"
                  message: "Backend health endpoint did not report 'ready' status. The backend may be running but unable to reach PostgreSQL, Redis, or S3. Check the health endpoint response in the support bundle for details."
              - pass:
                  when: "true"
                  message: "Backend health endpoint reports 'ready' status — PostgreSQL, Redis, and S3 are all accessible."
        - textAnalyze:
            checkName: Critical application errors in pod logs
            fileName: "bundle-analyzer-*/*.log"
            regex: '(?i)(Failed to process bundle|bundle_upload_s3_error|Failed to reanalyze bundle|cleanup_stuck_bundles failed|report_custom_metrics failed|Metrics collection failed)'
            outcomes:
              - fail:
                  when: "true"
                  message: "Critical application errors detected in pod logs. This indicates bundle processing failures, S3 upload errors, stuck bundle cleanup failures, or metrics reporting failures. Search the support bundle log files for the matched error pattern to identify the affected component and root cause."
              - pass:
                  when: "false"
                  message: "No critical application errors found in collected pod logs."
