{{- /*
INSTALL-TIME-STABLE SECRETS — DO NOT REGENERATE ON UPGRADE

JWT_SECRET_KEY and SECRET_KEY are auto-generated once on first install and
preserved on every subsequent upgrade. Regenerating them would invalidate
every issued JWT (every logged-in user gets kicked out) and break any
session/CSRF-protected state. This is the canonical Phase 5.2 contract:
"auto-generated install-time defaults that survive upgrade."

Length: 64 alphanumeric chars ≈ 380 bits of entropy. Far above the ~256 bits
needed for HMAC-SHA256 signing keys; chosen for headroom, not specificity.

Resolution order per field:
  1. Existing Secret in the namespace has a value → reuse it.
  2. Else `.Values.global.{jwt,}secretKey` is non-empty (--set escape hatch
     for tests / local dev) → use it.
  3. Else → generate randAlphaNum 64.

IMPORTANT — UPGRADE BEHAVIOR

We require `lookup` to find the existing Secret on every upgrade. If `lookup`
returns nil during an upgrade (RBAC misconfigured, namespace mismatch, etc.),
the template would otherwise silently regenerate the secret and invalidate
every JWT in flight. The `.Release.IsUpgrade` guard below converts that
silent failure into a loud one: the upgrade fails with a clear message
telling the operator to check Secret permissions or delete the secret
deliberately if rotation is intended.

ROTATION PROCEDURE (when you ACTUALLY want new values)

The chart will never rotate these on its own — that's the whole point. To
rotate deliberately:

    kubectl -n <namespace> delete secret <release-name>-app-secrets
    helm upgrade <release> <chart> ...

All sessions will be invalidated. Users will need to log in again. Acceptable
if you're rotating because of a compromise; surprising if you didn't mean to.

The `helm.sh/resource-policy: keep` annotation also means this Secret
survives `helm uninstall`, so accidentally uninstalling and reinstalling will
not rotate the value.

RELATED

  - chart/templates/secret.yaml — the templated-every-upgrade companion
  - chart/templates/tls-secret.yaml — week-1 friction log #2; same lookup
    pattern, "emit-only-if-missing" variant for TLS certs
*/}}
{{- $secretName := printf "%s-app-secrets" (include "bundle-analyzer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}

{{- if and .Release.IsUpgrade (not $existing) }}
  {{- fail (printf "FATAL: secret %q not found during upgrade. Refusing to silently regenerate JWT_SECRET_KEY/SECRET_KEY (would invalidate all sessions). If you intend to rotate, run: kubectl -n %s delete secret %s, then retry the upgrade. Otherwise check Secret read permissions for the Helm operator." $secretName .Release.Namespace $secretName) }}
{{- end }}

{{- $jwt := "" }}
{{- $sk  := "" }}
{{- if $existing }}
  {{- $jwt = index $existing.data "JWT_SECRET_KEY" | default "" | b64dec }}
  {{- $sk  = index $existing.data "SECRET_KEY"     | default "" | b64dec }}
{{- end }}
{{- if not $jwt }}
  {{- $jwt = .Values.global.jwtSecretKey | default (randAlphaNum 64) }}
{{- end }}
{{- if not $sk }}
  {{- $sk = .Values.global.secretKey | default (randAlphaNum 64) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ $jwt | quote }}
  SECRET_KEY: {{ $sk | quote }}
