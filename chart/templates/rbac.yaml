apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-backend
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-bundle-collector
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
rules:
  # Core resources needed by support-bundle collectors
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - persistentvolumes
      - nodes
      - events
      - serviceaccounts
      - namespaces
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  # Needed for cluster-info collector
  - apiGroups: [""]
    resources: ["componentstatuses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-bundle-collector
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bundle-analyzer.fullname" . }}-bundle-collector
subjects:
  - kind: ServiceAccount
    name: {{ include "bundle-analyzer.fullname" . }}-backend
    namespace: {{ .Release.Namespace }}
