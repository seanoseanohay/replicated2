apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-beat
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.beat.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
      {{- include "bundle-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: beat
        {{- include "bundle-analyzer.selectorLabels" . | nindent 8 }}
    spec:
{{- include "bundle-analyzer.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-deps
          image: "{{ .Values.initContainers.image.repository }}:{{ .Values.initContainers.image.tag }}"
          command:
            - /bin/sh
            - -c
            - >
              until nc -z {{ include "bundle-analyzer.postgresHost" . }} {{ include "bundle-analyzer.postgresPort" . }} &&
              nc -z {{ include "bundle-analyzer.redisName" . }} 6379 &&
              nc -z {{ include "bundle-analyzer.minioName" . }} 9000;
              do echo "waiting for dependencies"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: beat
          image: "{{ include "bundle-analyzer.image" (list .Values.global .Values.beat.image .Values.beat.image.tag) }}"
          imagePullPolicy: {{ .Values.beat.image.pullPolicy }}
          command:
            - /app/entrypoint.sh
          envFrom:
            - secretRef:
                name: {{ include "bundle-analyzer.fullname" . }}-secret
            - configMapRef:
                name: {{ include "bundle-analyzer.fullname" . }}-backend-config
          env:
            - name: SERVICE_ROLE
              value: beat
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bundle-analyzer.fullname" . }}-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bundle-analyzer.fullname" . }}-secret
                  key: REDIS_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bundle-analyzer.fullname" . }}-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bundle-analyzer.fullname" . }}-secret
                  key: S3_SECRET_KEY
            - name: REPLICATED_SDK_HOST
              value: "bundle-analyzer-sdk.{{ .Release.Namespace }}.svc.cluster.local"
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
