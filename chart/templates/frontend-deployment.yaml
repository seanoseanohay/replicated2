apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bundle-analyzer.fullname" . }}-frontend
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      {{- include "bundle-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        {{- include "bundle-analyzer.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-backend
          image: "{{ include "bundle-analyzer.image" (list .Values.global .Values.initContainers.image.repository .Values.initContainers.image.tag) }}"
          command:
            - /bin/sh
            - -c
            - >
              until nc -z {{ include "bundle-analyzer.fullname" . }}-backend 8000;
              do echo "waiting for backend"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: frontend
          image: "{{ include "bundle-analyzer.image" (list .Values.global .Values.frontend.image.repository .Values.frontend.image.tag) }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_URL
              value: {{ default (printf "http://%s-backend:8000" (include "bundle-analyzer.fullname" .)) .Values.frontend.backendUrl | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
