apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bundle-analyzer.minioName" . }}
  labels:
    {{- include "bundle-analyzer.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "bundle-analyzer.minioName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
      {{- include "bundle-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
        {{- include "bundle-analyzer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: "{{ include "bundle-analyzer.image" (list .Values.global .Values.minio.image.repository .Values.minio.image.tag) }}"
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.accessKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.secretKey | quote }}
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "bundle-analyzer.minioName" . }}
